apiVersion: v1
kind: Service
metadata:
  name: fox-api
  namespace: fox-insurance
spec:
  selector: {app: fox-api}
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fox-api
  namespace: fox-insurance
spec:
  replicas: 2
  selector:
    matchLabels: {app: fox-api}
  template:
    metadata:
      labels: {app: fox-api}
    spec:
      containers:
        - name: api
          image: fox-api:demo
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef: {name: fox-config}
          env:
            - name: MONGO_URL
              value: mongodb://mongo:27017
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 300m, memory: 256Mi}
          readinessProbe:
            httpGet: {path: /ready, port: 3000}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: 3000}
            initialDelaySeconds: 10
            periodSeconds: 10
