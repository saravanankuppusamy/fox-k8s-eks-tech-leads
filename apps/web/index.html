<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fox Insurance</title><style>body{font-family:system-ui;max-width:900px;margin:40px auto;padding:0 20px;background:#f4f7fb;color:#20334d}header{background:#194d86;color:white;padding:20px;border-radius:12px}button{padding:12px;margin:8px 8px 8px 0;background:#194d86;color:white;border:0;border-radius:7px;cursor:pointer}pre{background:white;padding:20px;white-space:pre-wrap;border-radius:10px}</style></head><body><header><h1>Fox Insurance</h1><p>Kubernetes & EKS orchestration demo</p></header><p>Choose a dataset. Requests are routed through Nginx to the internal Express API Service.</p><button onclick="load('customers')">Customers</button><button onclick="load('policies')">Policies</button><button onclick="load('claims')">Claims</button><pre id="out">Choose a button to load sample data.</pre><script>async function load(name){const el=document.getElementById('out');try{const response=await fetch('/api/'+name);if(!response.ok)throw Error('HTTP '+response.status);el.textContent=JSON.stringify(await response.json(),null,2)}catch(e){el.textContent=e.message}}</script></body></html>
