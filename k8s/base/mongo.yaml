apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: fox-insurance
spec:
  selector: {app: mongo}
  ports:
    - port: 27017
      targetPort: 27017
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
  namespace: fox-insurance
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: mongo}
  template:
    metadata:
      labels: {app: mongo}
    spec:
      containers:
        - name: mongo
          image: mongo:7.0
          ports:
            - containerPort: 27017
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          volumeMounts:
            - name: db
              mountPath: /data/db
      volumes:
        - name: db
          emptyDir: {}
